name: Build & Commit Chatwoot Assets

on:
  push:
    branches:
      - develop

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '23'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1.7

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libvips libpq-dev

      - name: Install Yarn
        run: |
          npm install -g yarn

      - name: Install JS packages
        run: yarn install --frozen-lockfile

      - name: Install Ruby gems
        run: bundle install

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Commit precompiled assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/packs
          git commit -m "chore: auto-compiled assets [skip ci]" || echo "No changes to commit"
          git push

