name: Build & Commit Chatwoot Assets

on:
  push:
    branches:
      - develop

jobs:
  build-assets:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove Ruby version enforcement
        run: |
          sed -i '/^ruby/d' Gemfile || true
          rm -f .ruby-version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.2'
          cache: 'yarn'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvips libpq-dev jq

      - name: Install Yarn (manual pin)
        run: |
          npm install -g yarn@1.22.22
          yarn --version

      - name: Patch Node.js engine constraint
        run: |
          jq 'del(.engines)' package.json > tmp.$$.json && mv tmp.$$.json package.json

      - name: Install JS packages
        run: yarn install --frozen-lockfile

      - name: Force Ruby native gem compatibility
        run: bundle config set --local force_ruby_platform true

      - name: Install Ruby gems
        run: bundle install

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Commit compiled assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/packs || true
          git commit -m "chore: auto-compiled assets [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

