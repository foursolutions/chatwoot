name: Build & Commit Chatwoot Assets

on:
  push:
    branches:
      - develop

jobs:
  build-assets:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js v20
        uses: actions/setup-node@v3
        with:
          node-version: '20.19.2' # Exact to match your package.json
          cache: 'yarn'

      - name: Set up Ruby (bypass Gemfile version mismatch)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          allow-failure: true # Allows install even if Gemfile requires 3.4.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev libvips

      - name: Install Yarn manually (strict)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Patch package.json engine check to allow Node 20
        run: |
          jq 'del(.engines)' package.json > tmp.$$.json && mv tmp.$$.json package.json

      - name: Install JS packages
        run: yarn install --frozen-lockfile

      - name: Install Ruby gems (ignoring version mismatch warning)
        run: |
          bundle config set --local force_ruby_platform true
          bundle install

      - name: Precompile assets
        run: bundle exec rails assets:precompile

      - name: Commit precompiled assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/packs || true
          git commit -m "chore: auto-compiled assets [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push"

