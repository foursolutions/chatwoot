services:
  - type: web
    name: chatwoot-web
    env: ruby
    plan: starter
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec rails s -b 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatwoot-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max_old_space_size=3584
