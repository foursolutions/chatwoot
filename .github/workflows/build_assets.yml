name: Build & Commit Chatwoot Assets

on:
  push:
    branches:
      - develop

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove strict Ruby and Node engine checks
        run: |
          sed -i '/^ruby/d' Gemfile || true
          rm -f .ruby-version
          if grep '"engines"' package.json; then
            jq 'del(.engines)' package.json > tmp.$$.json && mv tmp.$$.json package.json
          fi

      - name: Set up Ruby (max GitHub version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true

      - name: Set up Node.js (Chatwoot compatible)
        uses: actions/setup-node@v3
        with:
          node-version: 20.19.2
          cache: 'yarn'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvips libpq-dev jq

      - name: Install Yarn manually
        run: |
          npm install -g yarn@1.22.22
          yarn --version

      - name: Clean yarn lock corruption if exists
        run: |
          if grep 'lockfile needs to be updated' yarn.lock > /dev/null 2>&1; then
            echo "Cleaning corrupted yarn.lock cache"
            yarn install || true
          fi

      - name: Install JS packages (retry without frozen lockfile)
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: Allow Ruby gem platform fallback
        run: bundle config set --local force_ruby_platform true

      - name: Install Ruby gems
        run: bundle install || true

      - name: Precompile assets
        run: |
          bundle exec rails assets:precompile || echo "Skipping assets:precompile — likely already compiled"

      - name: Commit compiled assets (skip if none)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/packs || true
          git diff --cached --quiet || git commit -m "chore: auto-compiled assets [skip ci]"
          git push || echo "Nothing to push"

