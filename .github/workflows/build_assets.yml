name: Build & Commit Chatwoot Assets

on:
  push:
    branches:
      - develop

jobs:
  build_assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libreadline-dev zlib1g-dev libpq-dev \
                                   nodejs npm postgresql-client curl
          npm install -g yarn

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Install JavaScript dependencies (Yarn)
        run: |
          yarn install --network-timeout 600000 --network-concurrency 1

      - name: Precompile Rails assets
        run: |
          export RAILS_ENV=production
          bundle exec rails assets:precompile

      - name: Commit and push compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/packs public/dist app/assets/builds || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: add precompiled assets via GitHub Actions [skip ci]"
            git push origin HEAD:develop
          else
            echo "No asset changes to commit."
          fi
